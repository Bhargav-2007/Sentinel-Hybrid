  name: {{ include "sentinel.fullname" . }}-model3
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: model3
spec:
  replicas: {{ .Values.model3.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sentinel.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: model3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sentinel.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: model3
    spec:
      containers:
        - name: model3
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.model3.image.repository }}:{{ .Values.model3.image.tag }}"
          imagePullPolicy: {{ .Values.model3.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.model3.service.port }}
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.externalServices.postgres.host }}:{{ .Values.externalServices.postgres.port }}/sentinel_model3"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{ .Values.externalServices.postgres.user }}"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "{{ .Values.externalServices.kafka.brokers }}"
          resources:
            {{- toYaml .Values.model3.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
{{- end }}
