# Default values for Gujarat Sentinel Hybrid Platform
global:
  environment: production
  domain: sentinel.police.gujarat.gov.in
  imageRegistry: registry.police.gujarat.gov.in/sentinel

# ── Infrastructure dependencies (in-cluster or external) ───────────────────
externalServices:
  postgres:
    host: "postgres-postgresql.database.svc.cluster.local"
    port: 5432
    user: "sentinel"
    passwordSecret: "sentinel-secrets"
    passwordKey: "POSTGRES_PASSWORD"
  redis:
    host: "redis-master.database.svc.cluster.local"
    port: 6379
    passwordSecret: "sentinel-secrets"
    passwordKey: "REDIS_PASSWORD"
  kafka:
    brokers: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
  opensearch:
    url: "http://opensearch-cluster.search.svc.cluster.local:9200"
  minio:
    endpoint: "http://minio.storage.svc.cluster.local:9000"
    accessKey: "minio_access_key"
    secretKeySecret: "sentinel-secrets"
    secretKeyKey: "MINIO_SECRET_KEY"
    bucketSnapshots: "sentinel-snapshots"
    bucketClips: "sentinel-clips"
  keycloak:
    issuerUrl: "http://keycloak.auth.svc.cluster.local:8080/realms/sentinel"
  opa:
    url: "http://opa.security.svc.cluster.local:8181"
  otelCollector:
    endpoint: "otel-collector.monitoring.svc.cluster.local:4317"

# ── Model 1: CCTV Registry & GIS ───────────────────────────────────────────
model1:
  enabled: true
  replicaCount: 3
  image:
    repository: sentinel-model1
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8001
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "256Mi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75

# ── Model 2: Unified Viewing & ANPR ─────────────────────────────────────────
model2:
  enabled: true
  replicaCount: 3
  image:
    repository: sentinel-model2
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8002
  resources:
    limits:
      cpu: "4000m"
      memory: "4Gi"
    requests:
      cpu: "1000m"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 80

# ── Model 3: VMS Federation ──────────────────────────────────────────────────
model3:
  enabled: true
  replicaCount: 2
  image:
    repository: sentinel-model3
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8003
  resources:
    limits:
      cpu: "2000m"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 75

# ── Model 4: Central VMS & Tracking ──────────────────────────────────────────
model4:
  enabled: true
  replicaCount: 2
  image:
    repository: sentinel-model4
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8004
  resources:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

# ── Hybrid Gateway & Orchestrator ────────────────────────────────────────────
gateway:
  enabled: true
  replicaCount: 3
  image:
    repository: sentinel-hybrid-gateway
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    limits:
      cpu: "2000m"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "512Mi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70

# ── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
  hosts:
    - host: sentinel.police.gujarat.gov.in
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: sentinel-tls-cert
      hosts:
        - sentinel.police.gujarat.gov.in

# ── Monitoring / Prometheus ServiceMonitors ──────────────────────────────────
serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 15s
