{{- if .Values.model1.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sentinel.fullname" . }}-model1
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: model1
spec:
  replicas: {{ .Values.model1.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sentinel.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: model1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "sentinel.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: model1
    spec:
      containers:
        - name: model1
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.model1.image.repository }}:{{ .Values.model1.image.tag }}"
          imagePullPolicy: {{ .Values.model1.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.model1.service.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "sentinel.fullname" . }}-config
          env:
            - name: MODEL1_DATABASE_URL
              value: "postgresql+asyncpg://{{ .Values.externalServices.postgres.user }}:$(POSTGRES_PASSWORD)@{{ .Values.externalServices.postgres.host }}:{{ .Values.externalServices.postgres.port }}/sentinel_model1"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ .Values.externalServices.redis.host }}:{{ .Values.externalServices.redis.port }}/0"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "sentinel.fullname" . }}-secrets
                  key: REDIS_PASSWORD
          resources:
            {{- toYaml .Values.model1.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
{{- end }}
