name: Gujarat Sentinel CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality-and-security:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Lint & Security Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx psutil pyyaml pydantic

      - name: Execute Automated Secret Scanner
        run: |
          python scripts/security/scan_secrets.py

      - name: Execute Security & Vulnerability Auditor
        run: |
          python scripts/security/security_audit.py

  unit-and-integration-tests:
    name: Unit & AI Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AI & Backend Dependencies
        run: |
          pip install pytest httpx numpy pydantic sqlalchemy fastapi passlib python-jose prometheus-client rich psutil pyyaml

      - name: Run Full-Stack Runner Unit Tests
        run: |
          pytest tests/unit/test_runner.py -v

      - name: Run Difficult-Condition ANPR & Voting Tests
        run: |
          pytest ai-detection/tests/test_anpr_difficult_conditions.py -v

      - name: Run Failure Resilience & Recovery Tests
        run: |
          python scripts/demo/test_failure_resilience.py

  frontend-build:
    name: Frontend Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci --legacy-peer-deps || npm install
          npm run build
