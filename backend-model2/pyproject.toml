[project]
name = "sentinel-model2"
version = "1.0.0"
description = "Gujarat Sentinel Model 2 — Unified Viewing & ANPR Analytics"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # ── Web Framework ─────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "uvloop>=0.21.0",
    "httptools>=0.6.1",
    "python-multipart>=0.0.12",

    # ── Database (PostgreSQL + async) ─────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # ── Redis ─────────────────────────────────────────────────
    "redis[hiredis]>=5.2.0",

    # ── Kafka ─────────────────────────────────────────────────
    "aiokafka>=0.12.0",
    "cloudevents>=1.11.0",

    # ── OpenSearch ────────────────────────────────────────────
    "opensearch-py[async]>=2.7.0",

    # ── AI/ML (CPU only) ──────────────────────────────────────
    "ultralytics>=8.3.0",              # YOLOv8n vehicle detection
    "paddlepaddle>=2.6.0",             # PaddleOCR backend (CPU)
    "paddleocr>=2.8.0",                # ANPR plate reading
    "opencv-python-headless>=4.10.0",  # Frame processing
    "numpy>=1.26.0",
    "Pillow>=10.4.0",

    # ── Video / Stream Processing ─────────────────────────────
    "av>=13.1.0",                      # PyAV (FFmpeg bindings) for RTSP
    "aiortc>=1.9.0",                   # WebRTC WHEP

    # ── HTTP client ───────────────────────────────────────────
    "httpx>=0.27.0",

    # ── Observability ─────────────────────────────────────────
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "prometheus-client>=0.21.0",
    "prometheus-fastapi-instrumentator>=7.0.0",

    # ── Security ──────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",

    # ── Settings ──────────────────────────────────────────────
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # ── Object storage ────────────────────────────────────────
    "boto3>=1.35.0",                   # S3 (MinIO) for snapshots
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "testcontainers[postgres,redis]>=4.8.0",
    "rich>=13.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
