# ──────────────────────────────────────────────────────────────────
# Gujarat Sentinel — Model 3: VMS Federation
# Spring Boot Application Properties
# ──────────────────────────────────────────────────────────────────

spring.application.name=sentinel-model3
server.port=8003

# ── Database ─────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/sentinel_model3
spring.datasource.username=sentinel
spring.datasource.password=sentinel_secure_pass_2026
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Flyway ───────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ── Kafka ────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=sentinel-model3-consumer
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# ── Redis ────────────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=redis_secure_pass

# ── Mock VMS Endpoints ───────────────────────────────────────────
sentinel.vms.vendors[0].name=hikvision
sentinel.vms.vendors[0].type=HIKVISION
sentinel.vms.vendors[0].base-url=http://mock-vms-a:9001
sentinel.vms.vendors[0].username=admin
sentinel.vms.vendors[0].password=admin123
sentinel.vms.vendors[0].sdk-version=6.1.9.4

sentinel.vms.vendors[1].name=dahua
sentinel.vms.vendors[1].type=DAHUA
sentinel.vms.vendors[1].base-url=http://mock-vms-b:9002
sentinel.vms.vendors[1].username=admin
sentinel.vms.vendors[1].password=admin123
sentinel.vms.vendors[1].sdk-version=3.054.0000001

# ── Federation ───────────────────────────────────────────────────
sentinel.federation.sync-interval-ms=60000
sentinel.federation.health-check-interval-ms=30000
sentinel.federation.max-concurrent-connections=50
sentinel.federation.rtsp-transport=tcp
sentinel.federation.onvif-discovery-enabled=true

# ── Actuator ─────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true

# ── OpenAPI ──────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# ── Logging ──────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.in.gujarat.sentinel=DEBUG
logging.pattern.console=%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n
